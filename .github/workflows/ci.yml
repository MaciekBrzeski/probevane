name: ci

# probevane's own gate (dogfood — the test tool is itself tested). On every
# push/PR: typecheck, run probevane's self-tests, and the fixture eval.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: pip install pytest pytest-cov
      - run: npm ci || npm install
      - name: install fixture deps
        # BEFORE the self-tests: real-fixture tests (passk.scoreSuite over
        # react-todo) execute the fixture suite, which needs its node_modules.
        run: |
          for f in fixtures/*/; do if [ -f "$f/package.json" ]; then (cd "$f" && npm install --no-fund --no-audit --legacy-peer-deps); fi; done
      - name: engine gate (facet library — lint + typecheck + parity/snapshot)
        run: npm run engine:gate
      - name: typecheck
        run: npm run typecheck
      - name: probevane self-tests + coverage floor
        run: npm run coverage
      - name: dist build (packaging gate — must compile + copy ui)
        run: npm run build
      - name: dist smoke (packaging gate — dist must RUN, not just compile)
        run: node scripts/smoke-dist.mjs
      - name: ui perf budgets (render frame time, diff-flush ratio, bundle size)
        run: npm run bench:ui
      - name: skill + wiki in sync (drift gate)
        run: ./bin/probevane skill --check
      - name: vane lint + generated artifacts in sync (drift gate)
        run: ./bin/probevane vane --check
      - name: control-center UI in sync (drift gate — control.html is generated from src/ui/app/)
        run: node scripts/build-ui.mjs --check
      - name: source-quality gate (dogfood — probevane grades its own source)
        run: ./bin/probevane quality . --strict
      # Per-dir ratchet: fails only when a directory regresses below its recorded
      # 0.1-band floor (.probevane/mutation-baseline.json) — a localized, can-only-
      # improve gate. --min-score 0.5 is a global catastrophe backstop. The --budget
      # MUST match the budget the committed baseline was seeded with, so the
      # deterministic even-stride sample aligns (re-seed with --write-baseline if you
      # change it). Cost: reruns the full suite per mutant (~min per 10 mutants).
      - name: mutation ratchet (dogfood — do the tests actually catch bugs, per dir?)
        run: ./bin/probevane mutation . --budget 250 --ratchet --min-score 0.5
      - name: quality SARIF → code scanning (inline annotations)
        if: always()
        run: ./bin/probevane quality . --sarif > quality.sarif || true
      - name: upload quality SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: quality.sarif
      - name: regenerate probevane's own wiki spec (dogfood, keeps it fresh)
        run: ./bin/probevane spec . --wiki && test -f docs/wiki/project-probevane.md
      - name: dashboard e2e (real browser + visual regression)
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: fixture eval (no LLM)
        run: ./bin/probevane eval
      - name: path eval — refactor/feature/repair (replay cassettes, no LLM)
        run: ./bin/probevane eval --paths
