        $("bars").innerHTML = a.daily.map((d) => `<div class="bar" title="${esc(d.date)}: $${esc(d.cost)} \xB7 ${esc(d.accepted)}/${esc(d.runs)} \xB7 ${esc(d.errors)} err" style="height:${Math.round(d.cost / max * 100)}%"></div>`).join("");
      $("aggMeta").textContent = `${a.totals.runs} runs \xB7 $${a.totals.totalCost} \xB7 accept ${(a.totals.acceptRate * 100).toFixed(0)}%`;
      setStat("cost", "$" + a.totals.totalCost);
      setStat("accept", (a.totals.acceptRate * 100).toFixed(0) + "%");
    } catch {
    }
    try {
      const { alerts } = await j("/alerts");
      setStat("alertN", String(alerts.length));
      if (changed("alerts", alerts))
        $("alerts").innerHTML = alerts.length ? alerts.map((a) => `<div class="alert ${esc(a.severity)}"><b>${esc(a.kind)}</b> \u2014 ${esc(a.message)}</div>`).join("") : '<span class="muted">none</span>';
    } catch {
    }
    try {
      const { entries } = await j("/audit");
      $("audit").textContent = entries.slice(-30).reverse().map((e) => `${e.ts.slice(0, 19)}  ${e.action}  ${e.target}`).join("\n") || "no library mutations yet";
    } catch {
    }
  }
  $("run").onclick = async () => {
    const dir = $("dir").value.trim();
    const op = $("op").value;
    const flags = ($("flags").value.match(/"[^"]*"|\S+/g) ?? []).map((f) => f.replace(/^"|"$/g, ""));
    if (!dir) {
      $("runMsg").textContent = "enter a dir";
      return;
    }
    $("runMsg").textContent = "launching\u2026";
    try {
      const r = await j("/run", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ op, dir, flags }) });
      if (r.error) {
        $("runMsg").textContent = "\u2717 " + r.error;
        return;
      }
      $("runMsg").textContent = `\u25B6 job ${r.id} (${op})`;
      switchTab("runs");
      openRunLive(dir);
      poll();
    } catch (e) {
      $("runMsg").textContent = "\u2717 " + String(e);
    }
  };
  $("qbtn").onclick = async () => {
    const dir = $("qdir").value.trim();
    if (!dir) {
      $("quality").textContent = "enter a dir";
      return;
    }
    $("quality").textContent = "scanning\u2026";
    $("quality").classList.remove("muted");
    try {
      const q = await j("/quality?dir=" + encodeURIComponent(dir));
      $("qmeta").textContent = `grade ${q.score}/100 \xB7 ${q.errors} err \xB7 ${q.warns} warn \xB7 ${q.files.length} files \xB7 ${q.functions} fns \xB7 ${q.duplication.length} dup`;
      $("quality").textContent = q.violations.length ? q.violations.slice(0, 200).map((v) => `${v.file}:${v.line}  ${v.severity.toUpperCase()}  [${v.rule}] ${v.message}`).join("\n") : "clean \u2014 no violations";
    } catch (e) {
      $("quality").textContent = "\u2717 " + String(e);
    }
  };
  loadOps();
  loadProjects();
  loadConsole();
  poll();
  setInterval(poll, 4e3);
})();

</script>
</body>
</html>
