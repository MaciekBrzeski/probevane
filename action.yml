name: 'probevane'
description: 'Generate missing tests for changed files and report coverage on a PR'
inputs:
  directory:
    description: 'Project directory'
    default: '.'
  generate:
    description: 'Generate tests for untested changed files (needs anthropic-api-key)'
    default: 'false'
  anthropic-api-key:
    description: 'ANTHROPIC_API_KEY for live generation'
    required: false
  model:
    description: 'auto | haiku | sonnet | opus | local:<id>'
    default: 'auto'
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: install probevane + project deps
      shell: bash
      run: |
        npm --prefix "${{ github.action_path }}" ci || npm --prefix "${{ github.action_path }}" install
        cd "${{ inputs.directory }}" && npm ci || npm install
    - name: probevane ci
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        PROBEVANE_MODEL: ${{ inputs.model }}
      run: |
        BASE="${{ github.event.pull_request.base.sha }}"
        "${{ github.action_path }}/bin/probevane" ci "${{ inputs.directory }}" \
          --base "${BASE:-HEAD~1}" ${{ inputs.generate == 'true' && '--generate' || '' }}
    - name: comment coverage delta
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const body = process.env.GITHUB_STEP_SUMMARY && fs.existsSync(process.env.GITHUB_STEP_SUMMARY)
            ? fs.readFileSync(process.env.GITHUB_STEP_SUMMARY, 'utf8') : 'probevane ran.';
          await github.rest.issues.createComment({
            owner: context.repo.owner, repo: context.repo.repo,
            issue_number: context.issue.number, body,
          });
